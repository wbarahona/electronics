<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Electronics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" />
    <!-- Only the icons we use; icon_names must stay in alphabetical order. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_drop_down,autorenew,bolt,content_copy,content_cut,content_paste,delete,electrical_services,fast_forward,fast_rewind,library_add,lightbulb,pause,play_arrow,toggle_on&display=block"
    />
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <h1 class="title">Electronics</h1>
      <div id="palette" class="palette"></div>
      <div id="sim-controls" class="sim-controls">
        <span id="clock" class="clock"></span>
        <md-icon-button id="slower" title="Slower (10×)" aria-label="Slower">
          <md-icon>fast_rewind</md-icon>
        </md-icon-button>
        <md-filled-button id="run" title="Run or pause the simulation">
          <md-icon slot="icon">play_arrow</md-icon>
          <span>Run</span>
        </md-filled-button>
        <md-icon-button id="faster" title="Faster (10×)" aria-label="Faster">
          <md-icon>fast_forward</md-icon>
        </md-icon-button>
        <span id="speed" class="speed" title="Simulation speed"></span>
      </div>
    </header>
    <main class="workspace">
      <svg id="board" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M 20 0 L 0 0 0 20" />
          </pattern>
          <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-minor)" />
            <path d="M 100 0 L 0 0 0 100" />
          </pattern>
        </defs>
        <rect id="grid" fill="url(#grid-major)" />
        <g id="world"></g>
      </svg>
      <aside id="props" class="props" hidden></aside>
    </main>
    <div id="readout" class="readout" hidden></div>
    <div id="menu-anchor" class="menu-anchor"></div>
    <md-menu id="menu" anchor="menu-anchor" positioning="fixed"></md-menu>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
