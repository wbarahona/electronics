<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ampage</title>
    <link rel="icon" type="image/svg+xml" href="/ampage.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    />
    <!-- Only the icons we use; icon_names must stay in alphabetical order. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_drop_down,autorenew,avg_pace,battery_charging_full,bolt,build,check,close,content_copy,content_cut,content_paste,delete,developer_board,electrical_services,fast_forward,fast_rewind,folder_open,library_add,lightbulb,memory,mode_fan,monitoring,more_horiz,note_add,pause,play_arrow,print,save,schedule,search,speed,thermostat,toggle_on&display=block"
    />
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/src/theme.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-row">
        <h1 class="title">
          <button
            id="logo"
            class="logo"
            type="button"
            disabled
            aria-hidden="true"
          ></button
          ><span>Ampage</span>
        </h1>
        <div id="file-actions" class="file-actions">
          <md-icon-button
            id="file-new"
            title="New circuit"
            aria-label="New circuit"
          >
            <md-icon>note_add</md-icon>
          </md-icon-button>
          <md-icon-button id="file-open" title="Open… (⌘O)" aria-label="Open">
            <md-icon>folder_open</md-icon>
          </md-icon-button>
          <md-icon-button id="file-save" title="Save (⌘S)" aria-label="Save">
            <md-icon>save</md-icon>
          </md-icon-button>
          <md-icon-button
            id="file-print"
            title="Print… (⌘P)"
            aria-label="Print"
          >
            <md-icon>print</md-icon>
          </md-icon-button>
        </div>
        <div id="search" class="search" role="search">
          <label class="search-bar">
            <md-icon aria-hidden="true">search</md-icon>
            <input
              id="search-input"
              type="search"
              placeholder="Search parts"
              aria-label="Search parts"
              title="Search parts (⌘K)"
              aria-keyshortcuts="Meta+K Control+K"
              role="combobox"
              aria-expanded="false"
              aria-controls="search-results"
              aria-autocomplete="list"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <div
            id="search-results"
            class="search-results"
            role="listbox"
            aria-label="Matching parts"
            hidden
          ></div>
        </div>
        <div id="sim-controls" class="sim-controls">
          <span class="clock" title="Simulated time"
            ><md-icon aria-hidden="true">schedule</md-icon
            ><span id="clock"></span
          ></span>
          <md-icon-button
            id="slower"
            title="Slower (10×, ←)"
            aria-label="Slower"
          >
            <md-icon>fast_rewind</md-icon>
          </md-icon-button>
          <md-filled-button
            id="run"
            title="Run or pause the simulation (Space)"
          >
            <md-icon slot="icon">play_arrow</md-icon>
            <span>Run</span>
          </md-filled-button>
          <md-icon-button
            id="faster"
            title="Faster (10×, →)"
            aria-label="Faster"
          >
            <md-icon>fast_forward</md-icon>
          </md-icon-button>
          <span class="speed" title="Simulation speed"
            ><md-icon aria-hidden="true">avg_pace</md-icon
            ><span id="speed"></span
          ></span>
        </div>
      </div>
      <nav id="palette" class="palette" aria-label="Part categories"></nav>
    </header>
    <section id="palette-tray" class="tray" aria-label="Parts">
      <div class="tray-inner">
        <div class="tray-content">
          <div class="tray-parts"></div>
          <md-icon-button
            class="tray-close"
            title="Close"
            aria-label="Close parts"
          >
            <md-icon>close</md-icon>
          </md-icon-button>
        </div>
      </div>
    </section>
    <main class="workspace">
      <svg id="board" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern
            id="grid-minor"
            width="20"
            height="20"
            patternUnits="userSpaceOnUse"
          >
            <path d="M 20 0 L 0 0 0 20" />
          </pattern>
          <pattern
            id="grid-major"
            width="100"
            height="100"
            patternUnits="userSpaceOnUse"
          >
            <rect width="100" height="100" fill="url(#grid-minor)" />
            <path d="M 100 0 L 0 0 0 100" />
          </pattern>
        </defs>
        <rect id="grid" fill="url(#grid-major)" />
        <g id="world"></g>
      </svg>
      <aside id="props" class="props" hidden></aside>
      <div id="thermal-legend" class="thermal-legend" hidden>
        <div class="thermal-legend-title">
          <md-icon>thermostat</md-icon>Thermal view
        </div>
        <div class="thermal-legend-bar"></div>
        <div class="thermal-legend-labels">
          <span>Cool</span><span>Rated</span><span>Failing</span>
        </div>
      </div>
      <div id="tools" class="fab-menu">
        <div
          id="tools-items"
          class="fab-menu-items"
          role="menu"
          aria-label="Tools"
        >
          <button
            id="tool-scope"
            class="fab-menu-item"
            type="button"
            role="menuitemcheckbox"
            aria-checked="false"
          >
            <md-focus-ring></md-focus-ring>
            <md-ripple></md-ripple>
            <md-icon>monitoring</md-icon>
            <span>Oscilloscope</span>
            <md-icon class="fab-menu-check">check</md-icon>
          </button>
          <button
            id="tool-thermal"
            class="fab-menu-item"
            type="button"
            role="menuitemcheckbox"
            aria-checked="false"
          >
            <md-focus-ring></md-focus-ring>
            <md-ripple></md-ripple>
            <md-icon>thermostat</md-icon>
            <span>Thermal view</span>
            <md-icon class="fab-menu-check">check</md-icon>
          </button>
        </div>
        <md-fab
          id="tools-fab"
          variant="tertiary"
          label="Tools"
          title="Tools"
          aria-label="Tools"
          aria-haspopup="menu"
          aria-expanded="false"
          aria-controls="tools-items"
        >
          <md-icon slot="icon">build</md-icon>
        </md-fab>
      </div>
    </main>
    <md-dialog id="print-dialog" class="print-dialog">
      <div slot="headline" class="padded-title">Print</div>
      <form slot="content" id="print-form" method="dialog" class="print-body">
        <div class="print-options">
          <md-outlined-text-field
            name="title"
            label="Title"
          ></md-outlined-text-field>
          <div class="print-row">
            <md-outlined-select name="paper" label="Paper">
              <md-select-option value="A4" selected
                ><div slot="headline">A4</div></md-select-option
              >
              <md-select-option value="Letter"
                ><div slot="headline">Letter</div></md-select-option
              >
            </md-outlined-select>
            <md-outlined-select name="orientation" label="Orientation">
              <md-select-option value="landscape" selected
                ><div slot="headline">Landscape</div></md-select-option
              >
              <md-select-option value="portrait"
                ><div slot="headline">Portrait</div></md-select-option
              >
            </md-outlined-select>
          </div>
          <div class="print-group">Show</div>
          <label class="print-check"
            ><md-checkbox
              name="grid"
              touch-target="wrapper"
              checked
            ></md-checkbox
            >Grid</label
          >
          <label class="print-check"
            ><md-checkbox
              name="values"
              touch-target="wrapper"
              checked
            ></md-checkbox
            >Part values</label
          >
          <label class="print-check"
            ><md-checkbox name="flow" touch-target="wrapper"></md-checkbox
            >Current flow</label
          >
          <div class="print-group">Tools</div>
          <label class="print-check"
            ><md-checkbox name="thermal" touch-target="wrapper"></md-checkbox
            >Thermal view</label
          >
          <label class="print-check"
            ><md-checkbox name="scope" touch-target="wrapper"></md-checkbox
            >Oscilloscope (when open)</label
          >
          <label class="print-check"
            ><md-checkbox
              name="parts"
              touch-target="wrapper"
              checked
            ></md-checkbox
            >Parts list (own page)</label
          >
        </div>
        <div class="print-preview" aria-label="Preview"></div>
      </form>
      <div slot="actions" class="print-actions">
        <md-text-button form="print-form" value="cancel">Cancel</md-text-button>
        <md-filled-button form="print-form" value="print">
          <md-icon slot="icon">print</md-icon>
          Print
        </md-filled-button>
      </div>
    </md-dialog>
    <section id="scope" class="scope" aria-label="Oscilloscope" hidden>
      <div class="scope-head">
        <md-icon>monitoring</md-icon>
        <span class="scope-title">Oscilloscope</span>
        <span class="scope-channel ch1"
          ><span class="scope-dot"></span><span data-channel="CH1"></span
        ></span>
        <span class="scope-channel ch2"
          ><span class="scope-dot"></span><span data-channel="CH2"></span
        ></span>
        <span class="scope-time"></span>
        <md-icon-button
          class="scope-close"
          title="Close"
          aria-label="Close oscilloscope"
        >
          <md-icon>close</md-icon>
        </md-icon-button>
      </div>
      <canvas></canvas>
    </section>
    <div id="readout" class="readout" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
    <div id="menu-anchor" class="menu-anchor"></div>
    <md-menu id="menu" anchor="menu-anchor" positioning="fixed"></md-menu>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
